experiment:
  name: resunetpp_hpo_sp05_s123
data:
  root: dataset_v4_ms_sx200
  csv_file: dataset_v4_ms_sx200.csv
  images_dir: images
  masks_dir: masks
  source: lidar
  split_type: temporal
  use_sce: false
  augmentation: false
model:
  architecture: resunetpp
  in_channels: 22
  out_channels: 1
  features:
  - 64
  - 128
  - 256
  - 512
  dropout_p: 0.077
  num_groups: 8
training:
  seed: 123
  batch_size: 8
  learning_rate: 0.0001287
  epochs: 50
  loss: spatial_mse
  lambda_pearson: 0.5
  weight_decay: 0.0001239
  optimizer: adamw
  grad_clip: 1.0
  early_stopping: false
  num_workers: 0
  device: auto
output:
  models_dir: Articulo 1/Models
  results_dir: results/lambda_sweep_hpo/resunetpp_hpo_sp05_s123
  model_name: resunetpp_hpo_sp05_s123
