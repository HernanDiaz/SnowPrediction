experiment:
  name: unet_gn_s42

# U-Net with GroupNorm (replaces the unstable BatchNorm U-Net).
# Same Optuna-selected hyperparameters as the original U-Net (trial 11),
# architecture = unet_gn. Isolated outputs under results/unet_gn/.
# Dataset: dataset_v4_ms_sx200 (1m, 22ch). Split: train 2021-23 / val 2024 / test 2025.

data:
  root: "dataset_v4_ms_sx200"
  csv_file: "dataset_v4_ms_sx200.csv"
  images_dir: "images"
  masks_dir: "masks"
  source: "lidar"
  split_type: "temporal"
  use_sce: false
  augmentation: false

model:
  architecture: "unet_gn"
  in_channels: 22
  out_channels: 1
  features: [48, 96, 192, 384]
  dropout_p: 0.0012
  num_groups: 8

training:
  seed: 42
  batch_size: 16
  learning_rate: 3.064e-05
  epochs: 50
  loss: "mse"
  lambda_pearson: 0.0
  weight_decay: 2.149e-05
  optimizer: "adam"
  grad_clip: 1.0
  early_stopping: false
  num_workers: 0
  device: "auto"

output:
  models_dir: "results/unet_gn/weights"
  results_dir: "results/unet_gn/s42"
  model_name: "unet_gn_s42"
