experiment:
  name: unet_v4_2p5m

# UNet a 2.5m de resolucion con 17 canales (Sx_200m).
# Cada tile cubre 640m x 640m — rango optimo sugerido por experto (600-800m).
# Captura ambos quiebres de escala de la nieve (~20-30m y ~200-500m).
#
# Dataset : dataset_v4_2p5m (590 tiles: 507 train / 55 val / 28 test)
# Split   : train=2021-2023, val=2024, test=2025
# Canales : DEM, Slope, Northness, Eastness, TPI, SCE +
#           Sx_200m x8 + Persistencia (15d, 30d, 60d)

data:
  root: "dataset_v4_2p5m"
  csv_file: "dataset_v4_2p5m.csv"
  images_dir: "images"
  masks_dir: "masks"
  source: "lidar"
  split_type: "temporal"
  use_sce: false
  augmentation: true
  augmentation_mode: "h"

model:
  architecture: "unet"
  in_channels: 17
  out_channels: 1
  features: [64, 128, 256, 512]
  dropout_p: 0.1

training:
  batch_size: 8
  learning_rate: 0.001
  epochs: 150
  loss: "mse"
  weight_decay: 0.0001
  optimizer: "adamw"
  grad_clip: 1.0
  scheduler: "cosine"
  lr_min: 1.0e-6
  early_stopping: true
  es_patience: 30       # mas patience: con 63 steps/epoca los minimos tardan mas
  num_workers: 0
  device: "auto"

output:
  models_dir: "Articulo 1/Models"
  results_dir: "results/unet_v4_2p5m"
  model_name: "unet_v4_2p5m"
