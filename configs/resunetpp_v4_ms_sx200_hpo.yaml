experiment:
  name: resunetpp_v4_ms_sx200_hpo

# ResUNet++ con hiperparametros optimos del Optuna HPO (optuna_resunetpp_v4ms).
# Mejor trial: #17 | R2=0.2473 (50ep) | dataset_v4_ms_sx200 (22ch, 1m)
#
# Dataset : dataset_v4_ms_sx200 (1m, 22ch, Sx_200m)
# Split   : train=2021-2023, val=2024, test=2025

data:
  root: "dataset_v4_ms_sx200"
  csv_file: "dataset_v4_ms_sx200.csv"
  images_dir: "images"
  masks_dir: "masks"
  source: "lidar"
  split_type: "temporal"
  use_sce: false
  augmentation: false

model:
  architecture: "resunetpp"
  in_channels: 22
  out_channels: 1
  features: [64, 128, 256, 512]
  dropout_p: 0.077
  num_groups: 8

training:
  seed: 42
  batch_size: 8
  learning_rate: 1.287e-04
  epochs: 100
  loss: "mse"
  weight_decay: 1.239e-04
  optimizer: "adamw"
  grad_clip: 1.0
  early_stopping: false
  num_workers: 0
  device: "auto"

output:
  models_dir: "Articulo 1/Models"
  results_dir: "results/resunetpp_v4_ms_sx200_hpo"
  model_name: "resunetpp_v4_ms_sx200_hpo"
