experiment:
  name: resunetpp_meteo2_sp04_s42

data:
  root: "dataset_v4_ms_sx200_meteo2"
  csv_file: "dataset_v4_ms_sx200_meteo2.csv"
  images_dir: "images"
  masks_dir: "masks"
  source: "lidar"
  split_type: "temporal"
  use_sce: false
  augmentation: false

model:
  architecture: "resunetpp"
  in_channels: 35
  out_channels: 1
  features: [64, 128, 256, 512]
  dropout_p: 0.077
  num_groups: 8

training:
  seed: 42
  batch_size: 8
  learning_rate: 1.287e-04
  epochs: 50
  loss: "spatial_mse"
  lambda_pearson: 0.4
  weight_decay: 1.239e-04
  optimizer: "adamw"
  grad_clip: 1.0
  scheduler: "none"
  early_stopping: false
  num_workers: 0
  device: "auto"

output:
  models_dir: "Articulo 1/Models"
  results_dir: "results/resunetpp_meteo2_sp04_s42"
  model_name: "resunetpp_meteo2_sp04_s42"
