experiment:
  name: resunetpp_v4_ms_sx200_hpo_sp10

# ResUNet++ HPO params + SpatialMSELoss lambda=1.0
# Base: resunetpp_v4_ms_sx200_hpo (Trial 17, dataset_v4_ms_sx200)

data:
  root: "dataset_v4_ms_sx200"
  csv_file: "dataset_v4_ms_sx200.csv"
  images_dir: "images"
  masks_dir: "masks"
  source: "lidar"
  split_type: "temporal"
  use_sce: false
  augmentation: false

model:
  architecture: "resunetpp"
  in_channels: 22
  out_channels: 1
  features: [64, 128, 256, 512]
  dropout_p: 0.077
  num_groups: 8

training:
  seed: 42
  batch_size: 8
  learning_rate: 1.287e-04
  epochs: 50
  loss: "spatial_mse"
  lambda_pearson: 1.0
  weight_decay: 1.239e-04
  optimizer: "adamw"
  grad_clip: 1.0
  early_stopping: false
  num_workers: 0
  device: "auto"

output:
  models_dir: "Articulo 1/Models"
  results_dir: "results/resunetpp_v4_ms_sx200_hpo_sp10"
  model_name: "resunetpp_v4_ms_sx200_hpo_sp10"
