experiment:
  name: b3_ch_5ch

# PAPER - Block 3: Channel ablation — 5 topographic channels only.
# ResUNet++ with just DEM, Slope, Northness, Eastness, TPI (no SCE, no Sx, no persistence).
# Uses channel_indices to select first 5 channels from dataset_v4_ms_sx200,
# keeping the same tiles, split, and normalization as all other paper experiments.
#
# Dataset : dataset_v4_ms_sx200 (22ch) — only channels [0..4] loaded
# Split   : train=2021-2023, val=2024, test=2025
# Seed    : 42

data:
  root: "dataset_v4_ms_sx200"
  csv_file: "dataset_v4_ms_sx200.csv"
  images_dir: "images"
  masks_dir: "masks"
  source: "lidar"
  split_type: "temporal"
  use_sce: false
  augmentation: true
  augmentation_mode: "h"
  channel_indices: [0, 1, 2, 3, 4]

model:
  architecture: "resunetpp"
  in_channels: 5
  out_channels: 1
  features: [48, 96, 192, 384]
  dropout_p: 0.1
  num_groups: 8

training:
  seed: 42
  batch_size: 8
  learning_rate: 0.00039
  epochs: 300
  loss: "mse"
  weight_decay: 1.6e-05
  optimizer: "adam"
  grad_clip: 0.0
  scheduler: "cosine"
  lr_min: 1.0e-6
  early_stopping: true
  es_patience: 20
  num_workers: 0
  device: "auto"

output:
  models_dir: "Articulo 1/Models"
  results_dir: "paper/results/block3_channels/b3_ch_5ch"
  model_name: "b3_ch_5ch"
