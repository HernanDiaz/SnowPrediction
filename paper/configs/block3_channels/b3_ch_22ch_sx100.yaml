experiment:
  name: b3_ch_22ch_sx100

# PAPER - Block 3: Channel ablation — 22 channels with Sx at 100m radius.
# Full multi-scale architecture but Sx computed at 100m (vs 200m in the reference).
# Isolates the effect of the Sx search radius on model performance.
#
# Dataset : dataset_v4_ms (1m, 22ch, Sx_100m)
# Split   : train=2021-2023, val=2024, test=2025
# Seed    : 42

data:
  root: "dataset_v4_ms"
  csv_file: "dataset_v4_ms.csv"
  images_dir: "images"
  masks_dir: "masks"
  source: "lidar"
  split_type: "temporal"
  use_sce: false
  augmentation: true
  augmentation_mode: "h"

model:
  architecture: "resunetpp"
  in_channels: 22
  out_channels: 1
  features: [48, 96, 192, 384]
  dropout_p: 0.1
  num_groups: 8

training:
  seed: 42
  batch_size: 8
  learning_rate: 0.00039
  epochs: 300
  loss: "mse"
  weight_decay: 1.6e-05
  optimizer: "adam"
  grad_clip: 0.0
  scheduler: "cosine"
  lr_min: 1.0e-6
  early_stopping: true
  es_patience: 20
  num_workers: 0
  device: "auto"

output:
  models_dir: "Articulo 1/Models"
  results_dir: "paper/results/block3_channels/b3_ch_22ch_sx100"
  model_name: "b3_ch_22ch_sx100"
